<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quick Translate</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main id="app">
      <header>
        <div>
          <h1 data-i18n="extensionName">Quick Translate</h1>
          <p id="status" role="status" data-state="preparing"></p>
        </div>
      </header>

      <label class="switch-row" for="enabled">
        <span data-i18n="enabled">Enabled</span>
        <input id="enabled" type="checkbox">
      </label>

      <fieldset>
        <legend data-i18n="modeLabel">Translation mode</legend>
        <div class="mode-options">
          <label>
            <input type="radio" name="mode" value="selection">
            <span data-i18n="modeSelection">Select text</span>
          </label>
          <label>
            <input type="radio" name="mode" value="hover">
            <span data-i18n="modeHover">Mouse capture</span>
          </label>
        </div>
      </fieldset>

      <div class="target-field">
        <label for="target-language" data-i18n="targetLanguage">Target language</label>
        <select id="target-language"></select>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
